# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo.

databases:
  - name: dental-db
    plan: free
    databaseName: dental
    user: dental

services:
  - type: web
    name: dental-appointment-system
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dental-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_GATEWAY_SECRET
        generateValue: true
      - key: CLINIC_NAME
        value: RHU Calinog
