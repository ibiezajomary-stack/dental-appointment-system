# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo.

databases:
  - name: dental-db
    plan: free
    databaseName: dental
    user: dental

services:
  - type: web
    name: dental-appointment-system
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dental-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CLINIC_NAME
        value: RHU Calinog
      - key: SMS_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMS_SENDER
        value: iSmile

  # Hourly appointment SMS reminders. Render runs startCommand once per schedule
  # (UTC) then the process must exit — do not use the web service start command.
  # Dashboard (New → Cron Job): same buildCommand / startCommand / env as below.
  - type: cron
    name: dental-appointment-reminders
    runtime: node
    schedule: "0 * * * *"
    buildCommand: npm install && npm run db:generate && npm run build -w server
    startCommand: npm run cron
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dental-db
          property: connectionString
      - key: CLINIC_NAME
        value: RHU Calinog
      - key: SMS_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMS_SENDER
        value: iSmile
