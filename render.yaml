# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Dashboard → New → Blueprint → connect this repo.

databases:
  - name: dental-db
    plan: free
    databaseName: dental
    user: dental

services:
  - type: web
    name: dental-appointment-system
    runtime: node
    plan: free
    buildCommand: npm install && npm run build && npm run db:migrate:deploy
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dental-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CLINIC_NAME
        value: RHU Calinog
      - key: SMS_PROVIDER
        sync: false
      - key: SEMAPHORE_API_KEY
        sync: false
      - key: SEMAPHORE_SENDER_NAME
        value: DENTAL

  # Optional: reliable SMS reminders while the web service is asleep on the free plan.
  # Uncomment after the web service is live, then set the URL to your app host.
  # - type: cron
  #   name: dental-appointment-reminders
  #   schedule: "0 * * * *"
  #   buildCommand: "true"
  #   startCommand: >-
  #     curl -fsS -H "Authorization: Bearer $CRON_SECRET"
  #     "$RENDER_EXTERNAL_URL/api/internal/send-appointment-reminders"
